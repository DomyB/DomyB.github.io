# Refreshes the data behind https://domyb.github.io/stocks/
#
# Runs during European and US trading hours and after the US close, fetches
# prices and fundamentals, retrains the model (once a day) and publishes the
# JSON files on the `stock-data` branch, which the page reads directly from
# raw.githubusercontent.com. Nothing here touches `main`, so the blog's
# history stays clean.
#
# Times are UTC. GitHub may start scheduled runs a few minutes late.
name: Stocks data

on:
  schedule:
    - cron: "20,50 7-12 * * 1-5"    # Milan session (09:20–14:50 CET/CEST)
    - cron: "5,35 13-21 * * 1-5"    # US session (09:35 ET → after the close)
    - cron: "15 22 * * 1-5"         # once more after the close, to grade the day
    - cron: "40 23 * * 1-5"         # and a fallback: GitHub drops scheduled runs under load
  workflow_dispatch:
    inputs:
      full:
        description: "Force a new backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stocks-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the site (for the symbol list and the pipeline)
        uses: actions/checkout@v4

      - name: Check out the previous data (ledger, backtest, fundamentals)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: stock-data
          path: previous

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/stocks/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/stocks/requirements.txt

      - name: Build the data
        env:
          FULL: ${{ inputs.full == true && '--full' || '' }}
        run: |
          # Carry the ledger and backtest forward from the last run; on the very
          # first run, start from the snapshot committed with the site.
          PREV="--prev assets/data/stocks"
          if [ -f previous/summary.json ]; then PREV="--prev previous"; fi
          python tools/stocks/pipeline.py --out build $PREV $FULL

      - name: Publish to the stock-data branch
        run: |
          cd build
          git init -q -b stock-data
          git config user.name "stocks-bot"
          git config user.email "stocks-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Stocks data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stock-data

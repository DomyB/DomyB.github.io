<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__copy">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
    <ul class="site-footer__links" role="list">
      <li><a href="{{ '/archive/' | relative_url }}">All posts</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
      <li><a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a></li>
    </ul>
  </div>
</footer>

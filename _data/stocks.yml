# The stocks tracked on the Stocks page (/stocks/).
#
# Add a line with a Yahoo Finance symbol and the next data refresh picks it up
# (the refresh runs automatically during market hours; see the README). The
# `name` is optional: when it's missing the company's name comes from Yahoo.
# Symbols from other exchanges work too, for example `ENI.MI` for Milan.
#
# The page's prediction model is trained on every symbol in this list at once,
# so keep it to liquid, well-known names: a few dozen to a hundred is ideal.

